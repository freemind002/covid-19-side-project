# spring.application.name=covid_19
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/covid19?serverTimezone=Asia/Taipei&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=springboot

# 設定時區
spring.jackson.time-zone=GMT+8
# 設定時間的格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# 控制錯誤回應中是否包含詳細錯誤訊息（message 欄位）
spring.web.error.include-message=always
# 確保這裡有設定 jwt.secret（字串可以自己改，但建議長一點比較安全）
jwt.secret=mySecretKeyForJwtAuthenticationWhichMustBeLongEnoughForSecurity2026